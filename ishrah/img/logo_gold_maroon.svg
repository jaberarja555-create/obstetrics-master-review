  <!-- mortarboard -->
  <path d="M60 8l42 15-42 15-42-15z" fill="url(#g)" stroke="#8a6420" stroke-width=".8" stroke-linejoin="round"/>
  <path d="M60 23l-30 3v13" fill="none" stroke="url(#g)" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M27 39h6l-1 8h-4z" fill="url(#g)"/>
  <!-- open book -->
  <path d="M60 74c-12-9-28-11-48-8V92c20-3 36-1 48 8z" fill="url(#g)"/>
  <path d="M60 74c12-9 28-11 48-8V92c-20-3-36-1-48 8z" fill="url(#g)"/>
