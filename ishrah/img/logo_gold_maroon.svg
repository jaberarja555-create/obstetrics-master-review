  <path d="M20 72c13-1.5 25 0 34 4.5M66 76.5c9-4.5 21-6 34-4.5" fill="none" stroke="#fff3c9" stroke-width="1.6" stroke-linecap="round" opacity=".8"/>
  <path d="M8 63v31c22-4 40-2 52 8 12-10 30-12 52-8V63" fill="none" stroke="url(#g2)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
