  <path d="M40 30h40v22c0 9-9 15-20 18-11-3-20-9-20-18z" fill="url(#g2)"/>
  <!-- rod of Asclepius -->
  <path d="M60 32v34" stroke="#360f18" stroke-width="3" stroke-linecap="round"/>
