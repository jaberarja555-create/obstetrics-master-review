  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbe7a6"/><stop offset=".45" stop-color="#e2b75a"/><stop offset="1" stop-color="#a87a26"/></linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6dc8e"/><stop offset="1" stop-color="#b98a2f"/></linearGradient>
  </defs>
  <!-- sparkle -->
  <path d="M104 4l2.2 7.8L114 14l-7.8 2.2L104 24l-2.2-7.8L94 14l7.8-2.2z" fill="url(#g)"/>
