<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 104">
  <!-- اشرح لي emblem (owner's design, 18 Nov 2026): an open book, a heartbeat line and a stethoscope rising from the book -->
  <defs>
    <linearGradient id="pg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#cffbf8"/></linearGradient>
    <linearGradient id="cv" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4ff5d7"/><stop offset="1" stop-color="#17c4c2"/></linearGradient>
    <linearGradient id="tb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b9fff3"/><stop offset="1" stop-color="#3adccf"/></linearGradient>
    <linearGradient id="cp" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7ffbe2"/><stop offset="1" stop-color="#17c4c2"/></linearGradient>
  </defs>
  <!-- book cover and page edges -->
  <path d="M60 96c-13-8-30-10-51-7l-1 6c21-3 38-1 52 7 14-8 31-10 52-7l-1-6c-21-3-38-1-51 7z" fill="url(#cv)"/>
  <path d="M60 92c-13-8-30-10-50-7v4c20-3 37-1 50 7 13-8 30-10 50-7v-4c-20-3-37-1-50 7z" fill="#b8f7ef"/>
  <!-- pages -->
  <path d="M60 68c-12-8-29-10-50-7v24c21-3 38-1 50 7z" fill="url(#pg)" stroke="#2ad0c6" stroke-width="1.2" stroke-linejoin="round"/>
  <path d="M60 68c12-8 29-10 50-7v24c-21-3-38-1-50 7z" fill="url(#pg)" stroke="#2ad0c6" stroke-width="1.2" stroke-linejoin="round"/>
  <path d="M60 68v24" stroke="#2ad0c6" stroke-width="1.4"/>
  <path d="M19 70c12-1.5 22 0 33 4M19 77c12-1.5 22 0 33 4M68 74c11-4 21-5.5 33-4M68 81c11-4 21-5.5 33-4" fill="none" stroke="#9ceee6" stroke-width="1.3" stroke-linecap="round"/>
  <!-- heartbeat line -->
  <path d="M2 58h22l4-8 5 17 6-27 5 22 3-4h11" fill="none" stroke="#38ffcd" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- stethoscope: ear tubes, stem into the book, tube to the chest piece -->
  <path d="M44 9c-6 9-6 22 4 30 4 3 8 5 12 7M76 9c6 9 6 22-4 30-4 3-8 5-12 7" fill="none" stroke="url(#tb)" stroke-width="4.6" stroke-linecap="round"/>
  <path d="M60 46v22" stroke="url(#tb)" stroke-width="4.6" stroke-linecap="round"/>
  <path d="M60 58c10 0 30-2 32-16" fill="none" stroke="url(#tb)" stroke-width="3.6" stroke-linecap="round"/>
  <circle cx="44.5" cy="8" r="3.4" fill="url(#cp)"/><circle cx="75.5" cy="8" r="3.4" fill="url(#cp)"/>
  <circle cx="93" cy="34" r="9" fill="url(#cp)" stroke="#e9fffc" stroke-width="1.6"/>
  <circle cx="93" cy="34" r="3.6" fill="#e9fffc"/>
</svg>
