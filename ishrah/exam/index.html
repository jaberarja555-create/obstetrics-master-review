<head>

<title>SMRA Permanent Exam</title>
<meta name="description" content="SMRA Permanent Exam: the Sudan Medical Council permanent exam question bank — past papers, sheets and Fageery, with explanations, mock exams and progress.">

<script>
/* look, colour and text size before first paint (shared with SMRA) */
(function () {
  var d = document.documentElement;
  function g(k, v) { try { var x = localStorage.getItem(k); return x == null ? v : JSON.parse(x); } catch (e) { return v; } }
  var l = g('ish-lang', 'ar') === 'en' ? 'en' : 'ar'; d.lang = l; d.dir = 'ltr';
  var t = g('ish-theme', 'light'); if (t === 'auto') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  d.dataset.theme = t === 'dark' ? 'dark' : t === 'eye' ? 'eye' : 'light';
  d.dataset.pal = g('ex-pal', 'navy');
  d.dataset.fs = g('ex-fs', 'n');
  if (window.top !== window) d.classList.add('inframe');
})();
</script>
<link rel="stylesheet" href="css/exam.css?v=20">
