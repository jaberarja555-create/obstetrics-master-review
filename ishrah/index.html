<title>اشرح لي</title>
<meta name="description" content="اشرح لي: منصة تعليمية متكاملة لطلبة الطب في السودان: كورسات، محاضرات، مكتبة، فعاليات ومجتمع.">

<script>/* colour chosen in Settings (ish-pal): its stylesheet replaces app.css */
(function(){var P={teal:1,green:1,purple:1,maroon:1,graphite:1},p='blue';try{p=JSON.parse(localStorage.getItem('ish-pal')||'"blue"')}catch(e){}
document.write('<link id="ishcss" rel="stylesheet" href="css/'+(P[p]?'pal-'+p:'app')+'.css?v=35">');})();</script>
<noscript><link rel="stylesheet" href="css/app.css?v=35"></noscript>
<script>(function(){try{var l=JSON.parse(localStorage.getItem('ish-lang')||'"ar"');if(l==='en'){document.documentElement.lang='en';document.documentElement.dir='ltr';}
document.documentElement.setAttribute('data-theme',JSON.parse(localStorage.getItem('ish-theme')||'"light"'));document.documentElement.setAttribute('data-fs',JSON.parse(localStorage.getItem('ish-fs')||'"n"'));}catch(e){}})();</script>
</head>
<body>
<header id="top"></header>

<script src="js/subimg.js?v=35"></script>
<script>

(function(){var c=window.ISH_CONFIG||{};if(c.supabaseUrl&&c.supabaseAnonKey){document.write('<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"><\/script><script src="https://cdn.jsdelivr.net/npm/tus-js-client@4.1.0/dist/tus.min.js"><\/script>');}})();
</script>
