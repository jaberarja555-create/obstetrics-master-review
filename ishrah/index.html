<script>/* colour chosen in Settings (ish-pal): its stylesheet replaces app.css */
(function(){var P={teal:1,green:1,purple:1,maroon:1,graphite:1},p='blue';try{p=JSON.parse(localStorage.getItem('ish-pal')||'"blue"')}catch(e){}
document.write('<link id="ishcss" rel="stylesheet" href="css/'+(P[p]?'pal-'+p:'app')+'.css?v=161">');})();</script>

<script>/* test switch for the Android scrolling smear (owner, 18 Nov 2026): ishrahli.org/?safe=1 … 4 turns parts of the design off on this
   device so the cause can be found; ?safe=0 turns it off again. 1 = all, 2 = bars not fixed, 3 = no shadows/animations, 4 = no banner pictures */
(function(){try{var m=location.search.match(/[?&]safe=(\d)/);if(m){if(m[1]==='0')localStorage.removeItem('ish-safe');else localStorage.setItem('ish-safe',m[1]);}
var v=localStorage.getItem('ish-safe');if(v){document.documentElement.setAttribute('data-safe',{1:'bars fx pics',2:'bars',3:'fx',4:'pics'}[v]||'');document.documentElement.setAttribute('data-safen',v);}}catch(e){}})();</script>
<script>(function(){try{var l=JSON.parse(localStorage.getItem('ish-lang')||'"ar"');if(l==='en'){document.documentElement.lang='en';document.documentElement.dir='ltr';}
document.documentElement.setAttribute('data-theme',JSON.parse(localStorage.getItem('ish-theme')||'"light"'));document.documentElement.setAttribute('data-fs',JSON.parse(localStorage.getItem('ish-fs')||'"n"'));}catch(e){}})();</script>
