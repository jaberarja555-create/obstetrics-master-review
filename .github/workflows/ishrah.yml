# اشرح لي (owner, 17 Nov 2026): the new learning platform in ishrah/ deploys to its OWN Cloudflare Pages project "ishrah".
# The working branch ccr-38b3f943-ba1ode is published as the live site (https://ishrah.pages.dev, domain ishrahli.org);
# push to main → https://ishrah.pages.dev (add a custom domain in Cloudflare when ready). Any other branch → https://<branch>.ishrah.pages.dev (preview).
# It does not touch the three books, Student Master Review or their database. Uses the same Cloudflare secrets as the other workflows.
# The manual database job applies all numbered files. Recent migrations also run on the production
# branch when their files change, before deploying the app that needs them. Both use ISHRAH_DB_URL.
name: Ishrah
on:
  push:
    paths: ['ishrah/**', '.github/workflows/ishrah.yml']
  workflow_dispatch:
    inputs:
      database:
        description: 'apply the database file(s) in ishrah/supabase'
        type: boolean
        default: false
concurrency: ishrah-${{ github.ref_name }}
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect pending database migrations
        if: github.event_name == 'push' && github.ref_name == 'ccr-38b3f943-ba1ode'
        id: request-schema
        env:
          PREVIOUS_COMMIT: ${{ github.event.before }}
        run: |
          if ! git cat-file -e "$PREVIOUS_COMMIT^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$PREVIOUS_COMMIT"
          fi
          base=ishrah/supabase/013_course_requests.sql
          terms=ishrah/supabase/014_public_course_terms.sql
          payments=ishrah/supabase/015_payment_receipts.sql
          section=ishrah/supabase/016_section_publishing.sql
          library=ishrah/supabase/017_library_activity.sql
          payouts=ishrah/supabase/018_lecturer_payouts.sql
          moderation=ishrah/supabase/019_report_moderation.sql
          feedback=ishrah/supabase/020_announcement_feedback.sql
          interactions=ishrah/supabase/021_feed_interactions.sql
          series=ishrah/supabase/022_file_series.sql
          paid=ishrah/supabase/023_paid_library.sql
          series_feedback=ishrah/supabase/024_series_feedback.sql
          upload_rights=ishrah/supabase/025_library_upload_rights.sql
          library_revisions=ishrah/supabase/026_library_file_revisions.sql
          library_subjects=ishrah/supabase/027_library_subjects.sql
          ratings=ishrah/supabase/028_balanced_ratings.sql
          discussion=ishrah/supabase/029_discussion_publishing.sql
          stars=ishrah/supabase/030_star_ratings.sql
          spaces=ishrah/supabase/031_space_members.sql
          reader_state=ishrah/supabase/032_reader_state.sql
          space_people=ishrah/supabase/033_space_people.sql
          usage=ishrah/supabase/034_usage.sql
          alerts=ishrah/supabase/035_alerts.sql
          routing=ishrah/supabase/036_alert_routing.sql
          review_wait=ishrah/supabase/037_course_request_review.sql
          edits=ishrah/supabase/038_course_request_edit.sql
          threads=ishrah/supabase/039_comment_threads.sql
          reactions=ishrah/supabase/040_reactions.sql
          live=ishrah/supabase/041_live_feedback.sql
          series_edit=ishrah/supabase/042_series_full_edit.sql
          lecturer_check=ishrah/supabase/043_lecturer_check.sql
          profile_sync=ishrah/supabase/044_profile_sync.sql
          team_tools=ishrah/supabase/045_team_tools.sql
          presence=ishrah/supabase/046_presence.sql
          dup_comments=ishrah/supabase/047_duplicate_comments.sql
          own_paid=ishrah/supabase/048_own_paid.sql
          follows=ishrah/supabase/049_follows.sql
          card_roles=ishrah/supabase/050_profile_card_roles.sql
          followers=ishrah/supabase/051_followers_list.sql
          free_posts=ishrah/supabase/052_free_posts.sql
          owner_alerts=ishrah/supabase/053_owner_all_alerts.sql
          team_spaces=ishrah/supabase/054_team_all_spaces.sql
          course_cert=ishrah/supabase/054_course_cert.sql
          assistant=ishrah/supabase/055_assistant.sql
          contact_guard=ishrah/supabase/056_contact_guard.sql
          pending=""
          for migration in "$base" "$terms" "$payments" "$section" "$library" "$payouts" "$moderation" "$feedback" "$interactions" "$series" "$paid" "$series_feedback" "$upload_rights" "$library_revisions" "$library_subjects" "$ratings" "$discussion" "$stars" "$spaces" "$reader_state" "$space_people" "$usage" "$alerts" "$routing" "$review_wait" "$edits" "$threads" "$reactions" "$live" "$series_edit" "$lecturer_check" "$profile_sync" "$team_tools" "$presence" "$dup_comments" "$own_paid" "$follows" "$card_roles" "$followers" "$free_posts" "$owner_alerts" "$course_cert" "$assistant" "$team_spaces" "$contact_guard"; do
            if [ -n "$pending" ] || ! git diff --quiet "$PREVIOUS_COMMIT" "$GITHUB_SHA" -- "$migration"; then
              pending="${pending:+$pending }$migration"
            fi
          done
          echo "files=$pending" >> "$GITHUB_OUTPUT"
      - name: Apply and verify database migrations
        if: steps.request-schema.outputs.files != ''
        env:
          DB: ${{ secrets.ISHRAH_DB_URL }}
          MIGRATIONS: ${{ steps.request-schema.outputs.files }}
        run: |
          if ! command -v psql >/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client >/dev/null
          fi
          DB=$(printf '%s' "$DB" | tr -d '\r\n\t `"'"'"'<>')
          for migration in $MIGRATIONS; do
            psql "$DB" -v ON_ERROR_STOP=1 -q -f "$migration"
          done
          test "$(psql "$DB" -v ON_ERROR_STOP=1 -qAtc "set search_path = ''; select not public.ish_staff()")" = t
          test "$(psql "$DB" -v ON_ERROR_STOP=1 -Atc "select exists (select 1 from information_schema.columns where table_schema = 'public' and table_name = 'feed_feedback' and column_name = 'course_id') and to_regprocedure('public.ish_feed_react(text,uuid,integer)') is not null and to_regprocedure('public.ish_rate_file(uuid,integer)') is not null and to_regprocedure('public.ish_moderate_feed_report(uuid,boolean)') is not null and to_regclass('public.lecturer_payout_accounts') is not null and to_regprocedure('public.ish_lecturer_payout(text,uuid,uuid,uuid,numeric,uuid,text,text,text)') is not null and not exists (select 1 from public.lecturers where pay is distinct from '{}'::jsonb) and exists (select 1 from storage.buckets where id = 'payout-receipts' and not public) and to_regclass('public.library_comments') is not null and to_regprocedure('public.ish_library_comment(uuid,text,uuid)') is not null and to_regprocedure('public.ish_review_question(uuid,boolean,text)') is not null and to_regclass('public.course_live_links') is not null and to_regclass('public.payment_messages') is not null and to_regclass('public.course_request_files') is not null and to_regprocedure('public.ish_course_request(text,uuid,jsonb)') is not null and to_regprocedure('public.ish_public_course_terms(uuid)') is not null and exists (select 1 from storage.buckets where id = 'course-request-files' and not public) and to_regprocedure('ishrah_private.guard_library_subjects()') is not null and to_regprocedure('public.ish_review_library_revision(uuid,boolean,text)') is not null and to_regprocedure('ishrah_private.guard_library_upload_rights()') is not null and to_regprocedure('public.ish_series_rating_scores(uuid[])') is not null and to_regprocedure('public.ish_series_vote(uuid,text,integer)') is not null and to_regclass('public.file_buys') is not null and to_regprocedure('public.ish_seller_payout(text,uuid,numeric,uuid,text,text,text)') is not null")" = t
      - name: Phone alerts check (counts only, no personal data)
        if: always()
        env:
          DB: ${{ secrets.ISHRAH_DB_URL }}
        run: |
          if ! command -v psql >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client >/dev/null; fi
          DB=$(printf '%s' "$DB" | tr -d '\r\n\t `"'"'"'<>')
          psql "$DB" -Atc "select 'pg_net installed: ' || exists (select 1 from pg_extension where extname = 'pg_net')" || true
          psql "$DB" -Atc "select 'live feed: live_pulse in supabase_realtime publication: ' || exists (select 1 from pg_publication_tables where pubname = 'supabase_realtime' and schemaname = 'public' and tablename = 'live_pulse')" || true
          psql "$DB" -Atc "select 'live feed: pulses in the last hour: ' || count(*) from public.live_pulse where at > now() - interval '1 hour'" || true
          psql "$DB" -Atc "select 'online status: ish_presence installed: ' || exists (select 1 from pg_proc where proname = 'ish_presence') || ', accounts active in the last 10 minutes: ' || count(*) filter (where last_seen > now() - interval '10 minutes') || ', lecturers ever seen: ' || count(*) filter (where last_seen is not null and exists (select 1 from public.lecturers l where l.id = profiles.id)) from public.profiles" || true
          psql "$DB" -Atc "select 'phones registered for alerts: ' || count(*) || ' (team: ' || count(*) filter (where team) || ')' from public.push_subs" || true
          psql "$DB" -Atc "select 'alert deliveries in the last day by result: ' || coalesce(string_agg(coalesce(status_code::text, 'error') || ' x' || n, ', '), 'none') from (select status_code, count(*) n from net._http_response where created > now() - interval '1 day' group by 1) t" || true
      - name: Create the Pages project the first time (ignored when it exists)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@3 pages project create ishrah --production-branch=main || true
      - name: Install the packages of the functions (the guide assistant uses the Anthropic SDK)
        working-directory: ishrah
        run: |
          npm ci --no-audit --no-fund
          python3 ../tools/ishrah/guide.py   # the guide assistant learns the current pages and menus
      - name: Deploy ishrah/ (with its functions/)
        working-directory: ishrah
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          for i in 1 2 3; do npx --yes wrangler@3 pages deploy . --project-name=ishrah --branch="${GITHUB_REF_NAME}" --commit-dirty=true && break; [ $i = 3 ] && exit 1; sleep 20; done
      # the working branch is also the LIVE site (owner, 18 Nov 2026: "put the app on the domain"): https://ishrah.pages.dev and the custom
      # domain ishrahli.org show the newest version of this branch. The repository's main branch (the Obstetrics book) is not touched.
      - name: Publish as the live site
        if: github.ref_name == 'ccr-38b3f943-ba1ode'
        working-directory: ishrah
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          for i in 1 2 3; do npx --yes wrangler@3 pages deploy . --project-name=ishrah --branch=main --commit-dirty=true && exit 0; sleep 20; done; exit 1
  database:
    if: github.event_name == 'workflow_dispatch' && inputs.database
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install psql
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client >/dev/null
      - name: Apply ishrah/supabase/*.sql in name order (every file is safe to run again)
        env:
          DB: ${{ secrets.ISHRAH_DB_URL }}
        run: |
          DB=$(printf '%s' "$DB" | tr -d '\r\n\t `"'"'"'<>')
          case "$DB" in postgresql://*|postgres://*) ;; *) echo "ISHRAH_DB_URL must start with postgresql:// (the saved value has ${#DB} characters)"; exit 1;; esac
          for f in $(ls ishrah/supabase/*.sql | sort); do echo "== $f"; psql "$DB" -v ON_ERROR_STOP=1 -q -f "$f"; done
