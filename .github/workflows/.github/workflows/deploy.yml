# Every push to main rebuilds the book and deploys it to the existing Cloudflare Pages project
# (same address as before, so students keep their activation, notes and highlights).
# One-time setup in GitHub → Settings → Secrets and variables → Actions:
#   secrets:   OBS_KEY (Supabase: select k from obs_secret;), CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
#   variable:  CF_PAGES_PROJECT (the Pages project name, e.g. the part before .pages.dev)
name: Deploy the book
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency: deploy
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install cryptography
      - name: Build
        env:
          OBS_KEY: ${{ secrets.OBS_KEY }}
        run: python build.py
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@3 pages deploy build/site --project-name="${{ vars.CF_PAGES_PROJECT }}" --branch=main --commit-dirty=true
