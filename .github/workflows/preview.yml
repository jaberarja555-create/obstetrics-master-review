# App redesign preview (owner, 10 Nov 2026): every push to the `redesign` branch is built and put on the PREVIEW address
# https://redesign.<project>.pages.dev . The live book (branch main, deploy.yml) is not touched.
name: Preview the redesign
on:
  push:
    branches: [redesign]
  workflow_dispatch:
concurrency: preview
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install cryptography
      - name: Build
        env:
          OBS_KEY: ${{ secrets.OBS_KEY }}
        run: python build.py
      - name: Deploy to the Cloudflare Pages preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@3 pages deploy build/site --project-name="${{ vars.CF_PAGES_PROJECT }}" --branch=redesign --commit-dirty=true
