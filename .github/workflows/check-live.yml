# Checks that the live book apps serve the latest code (owner, 11 Nov 2026): fetches each live address and looks for a marker string.
# Runs on demand and when this file changes on a working branch. Prints FOUND / MISSING only; no student data.
name: Check live apps
on:
  workflow_dispatch:
  push:
    branches-ignore: [main]
    paths: ['.github/workflows/check-live.yml']
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Look for the latest code on each live app
        run: |
          check() { if curl -fsSL "$1" | grep -q "$2"; then echo "FOUND   $3"; else echo "MISSING $3"; fi; }
          check https://student-master-review.pages.dev/js/app.js "function preload" "Platform: books load in the background"
          check https://student-master-review.pages.dev/js/app.js "smr-move-" "Platform: receives students moved from a book link"
          check https://obstetrics-master-review.pages.dev/ "smrMove" "Obstetrics: own address moves to the main app"
          check https://pediatrics-master-review.jaberarja555.workers.dev/ "smrMove" "Pediatrics: own address moves to the main app"
          check https://surgery-master-review.jaberarja555.workers.dev/ "smrMove" "Surgery: own address moves to the main app"
          check https://pediatrics-master-review.jaberarja555.workers.dev/ "v2homeW" "Pediatrics: the new app design is live"
          check https://surgery-master-review.jaberarja555.workers.dev/ "v2homeW" "Surgery: the new app design is live"
          check https://student-master-review.pages.dev/js/app.js "moveGet" "Platform: old links land on Home first"
          check https://obstetrics-master-review.pages.dev/ "v2msheet" "Obstetrics: topic video and lecture from the reader"
          check https://obstetrics-master-review.pages.dev/ "controllerchange" "Obstetrics: new version shows right after opening"
          check https://student-master-review.pages.dev/js/app.js "palPick" "Platform: app colours"
          check https://obstetrics-master-review.pages.dev/ "hc3" "Obstetrics: new reading card"
          check https://obstetrics-master-review.pages.dev/sw.js "SKIP=" "Obstetrics: saves all files"
          check https://obstetrics-master-review.pages.dev/admin.html "stuCard" "Admin: one card per student"
          check https://pediatrics-master-review.jaberarja555.workers.dev/sw.js "ASSETS=\[\"./\"" "Pediatrics: saves all files"
          check https://surgery-master-review.jaberarja555.workers.dev/sw.js "ASSETS=\[\"./\"" "Surgery: saves all files"
      - name: The shared subscription answers (read-only; an invalid device id, so nothing is written)
        run: |
          U=https://kgdmjeffeqfdlfnjnnek.supabase.co/rest/v1/rpc; K=sb_publishable_aUgkKc4QpItV4yKKViVFCg_dipnUdDl
          rpc() { echo "$1 -> $(curl -s -X POST "$U/$1" -H "apikey: $K" -H "Content-Type: application/json" -d "$2")"; }
          rpc obs_request_status '{"p_dev":"x","p_kind":"phone","p_label":"t","p_book":"ped"}'
          rpc obs_request_status '{"p_dev":"x","p_kind":"phone","p_label":"t"}'
          rpc obs_check '{"p_dev":"x"}'
          echo "obs_key_of must be refused (key never public): $(curl -s -o /dev/null -w '%{http_code}' -X POST "$U/obs_key_of" -H "apikey: $K" -H "Content-Type: application/json" -d '{"p_book":"ped"}')"
