# Checks that the live book apps serve the latest code (owner, 11 Nov 2026): fetches each live address and looks for a marker string.
# Runs on demand and when this file changes on a working branch. Prints FOUND / MISSING only; no student data.
name: Check live apps
on:
  workflow_dispatch:
  push:
    branches-ignore: [main]
    paths: ['.github/workflows/check-live.yml']
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Look for the latest code on each live app
        run: |
          check() { if curl -fsSL "$1" | grep -q "$2"; then echo "FOUND   $3"; else echo "MISSING $3"; fi; }
          check https://studentmasterreview.com/js/app.js "function preload" "Platform: books load in the background"
          check https://studentmasterreview.com/js/app.js "smr-move-" "Platform: receives students moved from a book link"
          check https://obs.studentmasterreview.com/ "smrMove" "Obstetrics: own address moves to the main app"
          check https://ped.studentmasterreview.com/ "smrMove" "Pediatrics: own address moves to the main app"
          check https://srg.studentmasterreview.com/ "smrMove" "Surgery: own address moves to the main app"
          check https://ped.studentmasterreview.com/ "v2homeW" "Pediatrics: the new app design is live"
          check https://srg.studentmasterreview.com/ "v2homeW" "Surgery: the new app design is live"
          check https://studentmasterreview.com/js/app.js "moveGet" "Platform: old links land on Home first"
          check https://studentmasterreview.com/js/app.js "function prune" "Platform: lighter background loading"
          check https://srg.studentmasterreview.com/ "srr-search-button{display:none" "Surgery: no old search in the reader bar"
          check https://obs.studentmasterreview.com/sw.js "c.navigate" "Obstetrics: new version reloads old copies"
          check https://obs.studentmasterreview.com/sw.js "within 3 s" "Obstetrics: page asked online first (quick updates)"
          check https://ped.studentmasterreview.com/sw.js "c.navigate" "Pediatrics: new version reloads old copies"
          check https://ped.studentmasterreview.com/sw.js "within 3 s" "Pediatrics: page asked online first (quick updates)"
          check https://srg.studentmasterreview.com/sw.js "c.navigate" "Surgery: new version reloads old copies"
          check https://srg.studentmasterreview.com/sw.js "within 3 s" "Surgery: page asked online first (quick updates)"
          check https://srg.studentmasterreview.com/ "smrBack.inhd" "Surgery: Library button in the top bar on tablets"
          check https://ped.studentmasterreview.com/ "smrBack.inhd" "Pediatrics: Library button in the top bar on tablets"
          check https://obs.studentmasterreview.com/ "v2msheet" "Obstetrics: topic video and lecture from the reader"
          check https://obs.studentmasterreview.com/ "controllerchange" "Obstetrics: new version shows right after opening"
          check https://studentmasterreview.com/js/app.js "palPick" "Platform: app colours"
          check https://obs.studentmasterreview.com/ "hc3" "Obstetrics: new reading card"
          check https://obs.studentmasterreview.com/sw.js "SKIP=" "Obstetrics: saves all files"
          check https://obs.studentmasterreview.com/admin.html "stuCard" "Admin: one card per student"
          check https://ped.studentmasterreview.com/sw.js "ASSETS=\[\"./\"" "Pediatrics: saves all files"
          check https://srg.studentmasterreview.com/sw.js "ASSETS=\[\"./\"" "Surgery: saves all files"
          check https://studentmasterreview.com/js/app.js "older move" "Platform: a book address opens Home first"
          check https://srg.studentmasterreview.com/ "obs_set_name" "Surgery: today's changes (name online)"
          check https://ped.studentmasterreview.com/ "obs_set_name" "Pediatrics: today's changes (name online)"
          check https://obs.studentmasterreview.com/ "obs_set_name" "Obstetrics: today's changes (name online)"
          check https://surgery-master-review.jaberarja555.workers.dev/ "obs_set_name" "Surgery workers.dev: today's changes"
          check https://pediatrics-master-review.jaberarja555.workers.dev/ "obs_set_name" "Pediatrics workers.dev: today's changes"
          check https://srg.studentmasterreview.com/ "is optional" "Surgery: OLD optional text still served"
          echo "--- surgery sw version:"; curl -fsSL https://srg.studentmasterreview.com/sw.js | head -c 300; echo
          echo "--- surgery page headers:"; curl -sSI https://srg.studentmasterreview.com/ | grep -i "cache\|etag\|last-mod\|age"
          check https://srg.studentmasterreview.com/ "retired bottom bar" "Surgery: no empty band under the reader"
      - name: The shared subscription answers (read-only; an invalid device id, so nothing is written)
        run: |
          U=https://kgdmjeffeqfdlfnjnnek.supabase.co/rest/v1/rpc; K=sb_publishable_aUgkKc4QpItV4yKKViVFCg_dipnUdDl
          rpc() { echo "$1 -> $(curl -s -X POST "$U/$1" -H "apikey: $K" -H "Content-Type: application/json" -d "$2")"; }
          rpc obs_request_status '{"p_dev":"x","p_kind":"phone","p_label":"t","p_book":"ped"}'
          rpc obs_request_status '{"p_dev":"x","p_kind":"phone","p_label":"t"}'
          rpc obs_check '{"p_dev":"x"}'
          echo "obs_key_of must be refused (key never public): $(curl -s -o /dev/null -w '%{http_code}' -X POST "$U/obs_key_of" -H "apikey: $K" -H "Content-Type: application/json" -d '{"p_book":"ped"}')"
